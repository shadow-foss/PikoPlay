[env:pikoplay]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem = littlefs
; 8 MB flash: firmware 0-384 KB, ROM shelf 384 KB-7.7 MB (src/storage/shelf.h), LittleFS 256 KB
; (saves, settings) at the end. Changing filesystem_size moves LittleFS: its contents are lost.
board_upload.maximum_size = 8388608
board_build.filesystem_size = 0.25m
; 250 MHz overclock (the core raises the core voltage to 1.15 V automatically).
board_build.f_cpu = 250000000L
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
build_flags =
  -O2
  -Ilib/walnut_cgb
  -Ilib/infones
  -DUSER_SETUP_LOADED=1
  -DILI9225_DRIVER=1
  -DTFT_WIDTH=176
  -DTFT_HEIGHT=220
  ; ---- SPI0: SCK=GP2, MOSI=GP3 ----
  ; The microSD slot shares this bus (SD_CS = GP1, MISO = GP0). The display never reads, but
  ; TFT_MISO must be set so the SPI0 RX pin is routed for the SD card.
  -DTFT_MISO=0
  -DTFT_MOSI=3
  -DTFT_SCLK=2
  -DTFT_CS=4
  -DTFT_DC=5
  -DTFT_RST=6
  ; Required when another device (the SD card) shares the SPI bus.
  -DSUPPORT_TRANSACTIONS
  ; The panel is specified up to 45 MHz. At 250 MHz the SPI divider must be even, so this
  ; request ends up as 41.7 MHz.
  -DSPI_FREQUENCY=45000000
  ; Optional:
  ; microSD (CS GP1) is not fitted on this PCB revision; uncomment for the next one:
  ; -DPIKO_SD_CS=1
